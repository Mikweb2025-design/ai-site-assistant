<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>ai-site-assistant architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#394a63"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a8"/></marker>
    <style>
      .t{font-size:15px;fill:#1d2733}.h{font-size:17px;font-weight:700;fill:#1d2733}.s{font-size:12.5px;fill:#5a6779}.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;fill:#2b3a52}
      .box{fill:#ffffff;stroke:#394a63;stroke-width:1.6;rx:14}.in{fill:#f3f6fa;stroke:#c9d3e0;stroke-width:1.2;rx:9}
      .ln{stroke:#394a63;stroke-width:1.8;fill:none}.dash{stroke:#8a96a8;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
      .lab{font-size:12px;fill:#394a63}.badge{fill:#fff3df;stroke:#e1b66b;stroke-width:1.2;rx:9}
    </style>
  </defs>
  <rect width="1240" height="760" fill="#ffffff"/>

  <!-- browser -->
  <rect class="box" x="30" y="70" width="270" height="420"/>
  <text class="h" x="52" y="102">Visitor's browser</text>
  <rect class="in" x="50" y="122" width="230" height="64"/><text class="t" x="64" y="148">Floating widget</text><text class="s" x="64" y="168">bubble · chat · animated avatar</text>
  <rect class="in" x="50" y="198" width="230" height="64"/><text class="t" x="64" y="224">Microphone → 8 kHz µ-law</text><text class="s" x="64" y="244">AudioWorklet, plays the reply</text>
  <rect class="in" x="50" y="274" width="230" height="64"/><text class="t" x="64" y="300">Text-only mode</text><text class="s" x="64" y="320">when the engine is offline or busy</text>
  <rect class="in" x="50" y="350" width="230" height="64"/><text class="t" x="64" y="376">Language from the page</text><text class="s" x="64" y="396">DE · EN · IT texts, your colour</text>
  <text class="s" x="52" y="450">Loaded only if the admin switched it on.</text>
  <text class="s" x="52" y="468">No cookies, no third-party requests.</text>

  <!-- web server -->
  <rect class="box" x="400" y="40" width="440" height="560"/>
  <text class="h" x="424" y="72">Your web server  (nginx + PHP 8)</text>
  <rect class="in" x="420" y="90" width="400" height="58"/><text class="t" x="434" y="114">Admin  /admin/</text><text class="s" x="434" y="134">widget · behaviour · voice · knowledge · booking · mail · limits</text>
  <rect class="in" x="420" y="158" width="400" height="58"/><text class="m" x="434" y="182">assistant-config.php</text><text class="s" x="434" y="202">settings + free slots, pulled by the engine (token)</text>
  <rect class="in" x="420" y="226" width="400" height="58"/><text class="m" x="434" y="250">assistant-booking.php</text><text class="s" x="434" y="270">message → contact-form mail · booking → mails + CalDAV</text>
  <rect class="in" x="420" y="294" width="400" height="58"/><text class="m" x="434" y="318">assistant-calendar.php · assistant-voice.php</text><text class="s" x="434" y="338">ICS feed · voice samples for cloning</text>
  <rect class="in" x="420" y="362" width="400" height="58"/><text class="m" x="434" y="386">assistant-faq.php</text><text class="s" x="434" y="406">text-only answers from your site content, no AI model</text>
  <rect class="in" x="420" y="430" width="400" height="58"/><text class="t" x="434" y="454">private/  (outside the web root)</text><text class="s" x="434" y="474">tokens · settings · bookings (90 days) · CalDAV password (0600)</text>
  <rect class="in" x="420" y="498" width="400" height="86"/><text class="t" x="434" y="522">nginx proxy  /assistant/status · /assistant/ws</text><text class="s" x="434" y="542">same origin for the browser, the engine's address stays private,</text><text class="s" x="434" y="560">rate-limited, WebSocket upgrade.</text>

  <!-- engine -->
  <rect class="box" x="950" y="40" width="260" height="560"/>
  <text class="h" x="970" y="72">Engine  (your machine)</text>
  <text class="s" x="970" y="90">e.g. a Mac at home, port-forwarded</text>
  <rect class="in" x="968" y="106" width="224" height="62"/><text class="t" x="980" y="130">Guest gate</text><text class="s" x="980" y="150">origins · limits · 1 line · idle hang-up</text>
  <rect class="in" x="968" y="178" width="224" height="62"/><text class="t" x="980" y="202">STT  (optional)</text><text class="s" x="980" y="222">Parakeet · Whisper — local</text>
  <rect class="in" x="968" y="250" width="224" height="78"/><text class="t" x="980" y="274">Brain</text><text class="s" x="980" y="294">OpenAI-compatible: local Ollama</text><text class="s" x="980" y="311">by default · or Claude / hosted</text>
  <rect class="in" x="968" y="338" width="224" height="62"/><text class="t" x="980" y="362">TTS + voice clone  (optional)</text><text class="s" x="980" y="382">Qwen3-TTS · sample from admin</text>
  <rect class="in" x="968" y="410" width="224" height="80"/><text class="t" x="980" y="434">Dialog</text><text class="s" x="980" y="454">the system owns actions: recap →</text><text class="s" x="980" y="471">explicit yes → book → real outcome</text>
  <rect class="in" x="968" y="500" width="224" height="84"/><text class="t" x="980" y="524">Knowledge</text><text class="s" x="980" y="544">your public pages (llms.txt …)</text><text class="s" x="980" y="561">+ extra facts from the admin</text>

  <!-- outside services -->
  <rect class="box" x="400" y="640" width="200" height="90"/><text class="h" x="420" y="672">Nextcloud</text><text class="s" x="420" y="692">CalDAV: busy times in,</text><text class="s" x="420" y="710">booked events out</text>
  <rect class="box" x="620" y="640" width="200" height="90"/><text class="h" x="640" y="672">SMTP / mail</text><text class="s" x="640" y="692">confirmation + notification,</text><text class="s" x="640" y="710">contact-form style</text>
  <rect class="box" x="30" y="640" width="330" height="90"/><text class="h" x="50" y="672">Your calendar app</text><text class="s" x="50" y="692">subscribes to the ICS feed;</text><text class="s" x="50" y="710">visitors get an “add to calendar” link</text>

  <!-- arrows -->
  <path class="ln" d="M300 150 H400" marker-end="url(#a)"/><text class="lab" x="306" y="142">HTTPS</text>
  <path class="ln" d="M300 232 H400" marker-end="url(#a)" marker-start="url(#a)"/><text class="lab" x="304" y="224">WebSocket</text>
  <path class="dash" d="M300 306 H400" marker-end="url(#g)"/><text class="lab" x="304" y="298">fallback</text>
  <path class="ln" d="M820 540 H950" marker-end="url(#a)" marker-start="url(#a)"/><text class="lab" x="826" y="532">proxy_pass</text>
  <path class="ln" d="M968 186 H820" marker-end="url(#a)"/><text class="lab" x="842" y="178">pull settings</text><text class="lab" x="842" y="206">every minute (token)</text>
  <path class="ln" d="M968 440 H860 V255 H820" marker-end="url(#a)"/><text class="lab" x="866" y="352">book · message</text><text class="lab" x="866" y="368">voice samples</text>
  <path class="ln" d="M500 600 V640" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M720 600 V640" marker-end="url(#a)"/>
  <path class="dash" d="M195 640 V620 H440 V600" marker-end="url(#g)"/><text class="lab" x="206" y="612">ICS feed</text>

  <!-- legend -->
  <rect class="badge" x="950" y="640" width="260" height="96"/>
  <text class="t" x="964" y="662">Why this shape</text>
  <text class="s" x="964" y="682">The browser only talks to your site.</text>
  <text class="s" x="964" y="699">The engine pulls its settings (no inbound</text>
  <text class="s" x="964" y="716">write channel) and can be switched off:</text>
  <text class="s" x="964" y="733">the widget falls back to text answers.</text>

  <text class="h" x="30" y="30" style="font-size:20px">ai-site-assistant — how it fits together</text>
</svg>
